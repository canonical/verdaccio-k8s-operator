name: dev
base: ubuntu@24.04
sdks:
  - name: uv
    channel: latest/stable

  - name: docker-ce
    channel: latest/stable

  - name: juju-cli
    channel: latest/edge
    plugs:
      juju-config:
        interface: mount
        workshop-target: /home/workshop/.local/share/juju

  - name: project-charm-dev

actions:
  status: |
    docker info --format 'Docker {{.ServerVersion}}'
    kubectl get nodes
    juju status --color=false

  reset-cluster: |
    .workshop/charm-dev/bin/bootstrap --reset

  pack-rock: |
    rm -rf parts stage prime overlay
    rm -f verdaccio_*.rock
    rockcraft pack --destructive-mode --platform amd64
    chown workshop:workshop ./*.rock

  load-rock: |
    rockcraft.skopeo --insecure-policy copy \
      oci-archive:verdaccio_6.10.1_amd64.rock \
      docker-daemon:verdaccio:6.10.1
    kind load docker-image --name dev verdaccio:6.10.1

  pack-charm: |
    rm -rf parts stage prime overlay
    charmcraft pack --destructive-mode --platform amd64 "$@"
    chown workshop:workshop ./*.charm

