name: Publish to edge

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: charmhub-publish
  cancel-in-progress: false

jobs:
  ci:
    name: Validate revision
    uses: ./.github/workflows/ci.yaml # zizmor: ignore[self-repository] -- GitHub's documented local workflow syntax.
    with:
      commit_sha: ${{ github.sha }}

  rock:
    name: Build rock
    needs: ci
    permissions:
      contents: read
      packages: write # Push the built rock to this repository's GHCR package.
    uses: canonical/launchpad-actions/.github/workflows/build-rock.yaml@799f7ca218f01a8375713b1afb99935f9f9e272a
    with:
      commit_sha: ${{ github.sha }}

  charm:
    name: Build charm
    needs: ci
    permissions:
      contents: read
    uses: canonical/launchpad-actions/.github/workflows/build-charm.yaml@799f7ca218f01a8375713b1afb99935f9f9e272a
    with:
      commit_sha: ${{ github.sha }}
      charm_path: "."

  release:
    name: Release to latest/edge
    needs:
      - rock
      - charm
    permissions:
      contents: read
      packages: read # Pull the built rock from GHCR for the Charmhub resource upload.
    runs-on: ubuntu-24.04
    env:
      CHANNEL: latest/edge
      CHARM_NAME: verdaccio-k8s
      IMAGE_URL: ghcr.io/${{ github.repository }}:${{ github.sha }}-amd64
      RESOURCE_NAME: verdaccio-image
    steps:
      - name: Download packed charm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charm
          path: artifacts/charm

      - name: Install charmcraft
        run: sudo snap install --classic charmcraft --channel=3.x/stable

      - name: Upload charm revision
        id: charm
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          charm_files=(artifacts/charm/*.charm)
          if [ "${#charm_files[@]}" -ne 1 ]; then
            echo "Expected one packed charm, found ${#charm_files[@]}" >&2
            exit 1
          fi

          upload="$(charmcraft upload "${charm_files[0]}" --name "$CHARM_NAME" --format=json)"
          revision="$(jq -er '.revision' <<<"$upload")"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload image resource revision
        id: resource
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          set -euo pipefail
          upload="$(charmcraft upload-resource "$CHARM_NAME" "$RESOURCE_NAME" \
            --image "docker://${IMAGE_URL}" \
            --format=json)"
          revision="$(jq -er '.revision' <<<"$upload")"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Release charm and resource together
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          CHARM_REVISION: ${{ steps.charm.outputs.revision }}
          RESOURCE_REVISION: ${{ steps.resource.outputs.revision }}
        run: |
          set -euo pipefail
          charmcraft release "$CHARM_NAME" \
            --revision "$CHARM_REVISION" \
            --channel "$CHANNEL" \
            --resource "${RESOURCE_NAME}:${RESOURCE_REVISION}"

          {
            echo "## Charmhub release"
            echo "- Channel: ${CHANNEL}"
            echo "- Charm revision: ${CHARM_REVISION}"
            echo "- Resource revision: ${RESOURCE_REVISION}"
          } >> "$GITHUB_STEP_SUMMARY"
