version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/verdaccio-app"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
