project: verdaccio-k8s

path: /home/ubuntu/spread/verdaccio-k8s

backends:
  local:
    type: adhoc
    allocate: |
      sudo rm -rf /home/ubuntu/spread/verdaccio-k8s
      sudo sed -i 's/^\s*#\?\s*\(PermitRootLogin\|PasswordAuthentication\)\>.*/\1 yes/' /etc/ssh/sshd_config
      if [ -d /etc/ssh/sshd_config.d ]; then
        echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/00-spread.conf
      fi
      echo "ubuntu:${SPREAD_PASSWORD}" | sudo chpasswd
      sudo systemctl restart ssh
      ADDRESS localhost
    discard: |
      sudo rm -rf /home/ubuntu/spread/verdaccio-k8s
    systems:
      - ubuntu-24.04:
          username: ubuntu

suites:
  spread/integration/:
    summary: Verdaccio deployment stories
    environment:
      MODEL: "spread-$(HOST: date +%s%N)"
      CHARM: "${SPREAD_PATH}/verdaccio-k8s_amd64.charm"
      IMAGE: verdaccio/verdaccio:6.10.1
    prepare-each: |
      sudo -H -u ubuntu juju add-model "${MODEL}"
      sudo -H -u ubuntu juju deploy \
        --model "${MODEL}" \
        "${CHARM}" \
        --resource "verdaccio-image=${IMAGE}"
      sudo -H -u ubuntu env JUJU_MODEL="${MODEL}" juju wait-for \
        application verdaccio-k8s \
        --query='status=="active"' \
        --timeout 10m
    debug-each: |
      sudo -H -u ubuntu juju status --model "${MODEL}" --color=false
      sudo -H -u ubuntu juju ssh \
        --model "${MODEL}" \
        --container verdaccio \
        verdaccio-k8s/0 \
        /charm/bin/pebble services
      sudo -H -u ubuntu juju ssh \
        --model "${MODEL}" \
        --container verdaccio \
        verdaccio-k8s/0 \
        /charm/bin/pebble logs verdaccio
      sudo -H -u ubuntu juju config --model "${MODEL}" verdaccio-k8s
      sudo -H -u ubuntu juju ssh \
        --model "${MODEL}" \
        --container verdaccio \
        verdaccio-k8s/0 \
        cat /verdaccio/conf/config.yaml
    restore-each: |
      sudo -H -u ubuntu juju destroy-model \
        --no-prompt \
        --force \
        --destroy-storage \
        --no-wait \
        --timeout=60s \
        "${MODEL}" || true

exclude:
  - .git
  - .venv
  - .coverage
  - .pytest_cache
  - .ruff_cache
  - overlay
  - parts
  - prime
  - stage

kill-timeout: 30m
