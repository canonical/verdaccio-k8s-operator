project: verdaccio-k8s

path: /home/workshop/spread/verdaccio-k8s

backends:
  local:
    type: adhoc
    allocate: |
      sudo rm -rf /home/workshop/spread/verdaccio-k8s
      sudo install -d -m 0755 /etc/ssh/sshd_config.d
      printf '%s\n' 'PasswordAuthentication yes' |
        sudo tee /etc/ssh/sshd_config.d/00-spread.conf >/dev/null
      printf 'workshop:%s\n' "${SPREAD_PASSWORD}" | sudo chpasswd
      sudo systemctl restart ssh
      ADDRESS localhost
    discard: |
      sudo rm -rf /home/workshop/spread/verdaccio-k8s
      sudo rm -f /etc/ssh/sshd_config.d/00-spread.conf
      sudo passwd --lock workshop >/dev/null
      sudo systemctl restart ssh
    systems:
      - ubuntu-24.04:
          username: workshop

suites:
  spread/integration/:
    summary: Verdaccio deployment stories
    environment:
      MODEL: "spread-$(HOST: date +%s%N)"
      CHARM: "${SPREAD_PATH}/verdaccio-k8s_amd64.charm"
      IMAGE: verdaccio:6.10.1
    prepare-each: |
      source "${SPREAD_PATH}/spread/integration/helpers.sh"
      if ! docker image inspect "${IMAGE}" >/dev/null; then
        echo "Missing ${IMAGE}; run 'workshop run --uid 0 dev -- pack-rock' and 'workshop run dev -- load-rock'" >&2
        exit 1
      fi
      juju add-model --no-switch "${MODEL}"
      juju deploy \
        --model "${MODEL}" \
        "${CHARM}" \
        --resource "verdaccio-image=${IMAGE}"
      juju_model wait-for \
        application verdaccio-k8s \
        --query='status=="active"' \
        --timeout 10m
    debug-each: |
      source "${SPREAD_PATH}/spread/integration/helpers.sh"
      juju status --model "${MODEL}" --color=false
      run_in_workload \
        /charm/bin/pebble services
      run_in_workload \
        /charm/bin/pebble logs verdaccio
      run_in_workload \
        stat -c '%a %U:%G %n' /verdaccio/conf/config.yaml
    restore-each: |
      source "${SPREAD_PATH}/spread/integration/helpers.sh"
      juju destroy-model \
        --no-prompt \
        --force \
        --destroy-storage \
        --no-wait \
        --timeout=60s \
        "${MODEL}" || true

exclude:
  - .git
  - .venv
  - .coverage
  - .pytest_cache
  - .ruff_cache
  - overlay
  - parts
  - prime
  - stage
  - verdaccio_6.10.1_amd64.rock
  - verdaccio-app/node_modules
  - verdaccio-app/dist
  - verdaccio-app/metrics-plugin/dist
  - verdaccio-app/test-dist
  - tmp
  - .pnpm-store
  - bundles
  - images

kill-timeout: 30m
