type: charm
name: verdaccio-k8s
title: Verdaccio
summary: Operate a Verdaccio npm registry on Kubernetes.
description: |
  A Kubernetes charm that deploys and operates the Verdaccio private npm
  registry using the official OCI image.

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6
  - k8s-api

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

config:
  options:
    log-level:
      type: string
      default: info
      description: Verdaccio log level (debug, info, warning, or error).

containers:
  verdaccio:
    resource: verdaccio-image

resources:
  verdaccio-image:
    type: oci-image
    description: Official Verdaccio OCI image.
    upstream-source: verdaccio/verdaccio:6
