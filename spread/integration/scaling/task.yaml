summary: Unsafe scaling blocks and scaling down recovers

execute: |
  source "${SPREAD_PATH}/spread/integration/helpers.sh"

  juju scale-application \
    --model "${MODEL}" \
    verdaccio-k8s 2
  juju_model wait-for \
    application verdaccio-k8s \
    --query='status=="blocked"' \
    --timeout 2m

  BLOCKED_STATUS="$(juju status --model "${MODEL}" --color=false)"
  case "${BLOCKED_STATUS}" in
    *"Scale down to one unit; local storage cannot be shared"*) ;;
    *)
      echo "Unsafe scaling did not report the local-storage constraint"
      exit 1
      ;;
  esac

  juju scale-application \
    --model "${MODEL}" \
    verdaccio-k8s 1
  juju_model wait-for \
    application verdaccio-k8s \
    --query='status=="active"' \
    --timeout 2m
  ping_registry 4873
