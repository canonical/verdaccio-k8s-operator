summary: Pod recreation retains published packages and registered users

execute: |
  source "${SPREAD_PATH}/spread/integration/helpers.sh"

  publish_package
  INITIAL_POD_UID="$(read_pod_uid)"
  kubectl \
    --namespace "${MODEL}" \
    delete pod verdaccio-k8s-0

  pod_recreated=false
  for _ in {1..60}; do
    if RECREATED_POD_UID="$(read_pod_uid 2>/dev/null)" && \
       [ "${RECREATED_POD_UID}" != "${INITIAL_POD_UID}" ] && \
       ping_registry 4873; then
      pod_recreated=true
      break
    fi
    sleep 2
  done
  test "${pod_recreated}" = true

  verify_published_package
  run_in_workload \
    grep -q '^spread-user:' /verdaccio/storage/htpasswd
