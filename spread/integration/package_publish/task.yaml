summary: Non-root Verdaccio persists a published package

execute: |
  source "${SPREAD_PATH}/spread/integration/helpers.sh"

  publish_package
  sudo -H -u ubuntu juju ssh \
    --model "${MODEL}" \
    --container verdaccio \
    verdaccio-k8s/0 \
    test -f /verdaccio/storage/spread-published-package/package.json
